pre-commit:
  parallel: true
  commands:
    prettier:
      run: pnpm exec prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    eslint:
      glob: 'apps/www/**/*.{ts,tsx,js,jsx}'
      root: 'apps/www'
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    typecheck:
      run: pnpm run typecheck
    secrets:
      run: npx tsx scripts/run-gitleaks-staged.ts
    gen-manifest:
      glob: 'apps/www/registry/ui/**'
      root: 'apps/www'
      run: pnpm run gen:manifest
      stage_fixed: true
    gen-registry:
      glob: 'apps/www/{registry/ui,docs/previews}/**'
      root: 'apps/www'
      run: pnpm run gen:registry
      stage_fixed: true
    conventions:
      glob: 'apps/www/{registry/ui,docs/content/components,playground/entries,public/r,scripts}/**'
      root: 'apps/www'
      run: pnpm run check:conventions

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    build:
      run: pnpm run build
    test:
      run: pnpm --filter www test:unit

post-merge:
  commands:
    install:
      run: pnpm install

post-checkout:
  piped: true
  jobs:
    - name: install
      run: |
        [ "{3}" = "1" ] || exit 0
        case "{1}" in *[!0]*) git diff --quiet {1} {2} -- pnpm-lock.yaml && exit 0 ;; esac
        pnpm install
    - name: gen-lists
      run: pnpm -C apps/www gen:lists
