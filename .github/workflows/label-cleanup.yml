name: Strip agent labels on close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  strip-issue-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Remove agent-ready label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --remove-label agent-ready || true
