name: sandcastle-v2-impl

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */12 * * *'

concurrency:
  group: sandcastle-v2-impl-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.SANDCASTLE_BOT_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `pnpm sandcastle` invokes `tsx --env-file=.sandcastle/.env`, which
      # errors on a missing file. The file is gitignored (local secrets);
      # in CI all env vars come from the workflow env block, so an empty
      # file is sufficient to satisfy Node. Follow-up: switch to
      # `--env-file-if-exists` once CI Node bumps to 22+.
      - name: Stub .sandcastle/.env for tsx --env-file
        run: touch .sandcastle/.env

      - name: Run impl dispatch
        env:
          GH_TOKEN: ${{ secrets.SANDCASTLE_BOT_TOKEN }}
          SANDCASTLE_BOT_LOGIN: ora-gh-bot
          # Agent selection — repo Variables override the orchestrator's
          # built-in fallback (pi:anthropic/claude-sonnet-4-6 in resolveAgent).
          # Set vars.SANDCASTLE_IMPL_AGENT to e.g. 'claude-code:claude-sonnet-4-6'
          # to switch providers without editing this file.
          SANDCASTLE_IMPL_AGENT: ${{ vars.SANDCASTLE_IMPL_AGENT }}
          # Provider API keys — only the one matching the active provider is
          # actually read by resolveAgent. Empty values are harmless; the
          # orchestrator never reads keys for inactive providers.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm sandcastle --execute --only=impl
